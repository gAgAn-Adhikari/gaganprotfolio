<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #000428 0%, #004e92 100%); color: #fff; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .section-title { text-align: center; margin-bottom: 20px; font-size: 2rem; color: #ffffff; }
        .placeholder { text-align:center; color:rgba(255,255,255,0.75); padding:40px 20px; border: 1px dashed rgba(255,255,255,0.06); border-radius:10px; }

        /* Pocket */
        .pocket-wrap { display:flex; justify-content:center; align-items:center; gap:20px; margin-top:20px; position:relative; }
        .pocket { width:180px; height:120px; background: rgba(255,255,255,0.03); border-radius:14px; border:1px solid rgba(255,255,255,0.06); padding:12px; box-shadow:0 8px 24px rgba(0,0,0,0.4); overflow:visible; transition: transform 0.25s ease, box-shadow 0.25s ease; position:relative; }
        .pocket:hover { transform: translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,0.5); }
        .pocket-title { text-align:center; font-size:0.95rem; margin-bottom:8px; color:rgba(255,255,255,0.9); }

        .stack { position:relative; width:100%; height:80px; display:block; }
        .card { position:absolute; left:8px; top:0; width:calc(100% - 16px); height:70px; border-radius:8px; overflow:hidden; border:1px solid rgba(0,0,0,0.15); box-shadow:0 6px 18px rgba(0,0,0,0.25); background:#fff; transform-origin:center; cursor:pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .card img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(10%); }
        .card:nth-child(1){ transform: translate(0px, 0px) rotate(-2deg); z-index:3; }
        .card:nth-child(2){ transform: translate(10px, 8px) rotate(3deg); z-index:2; }
        .card:nth-child(3){ transform: translate(20px, 16px) rotate(-1deg); z-index:1; opacity:0; }

        .pocket:hover .card { transform: translateY(-6px) scale(1.02); }
        .card:hover { transform: translateY(-10px) scale(1.04); box-shadow:0 22px 40px rgba(0,0,0,0.5); z-index:10; }

        .cert-label{ text-align:center; margin-top:6px; font-size:0.85rem; color:rgba(255,255,255,0.9); }

        /* Spinning fire blade */
        .blade-wrap{ width:120px; height:120px; display:flex; align-items:center; justify-content:center; }
        .blade { width:64px; height:64px; display:block; transform-origin:center; animation: spin 2s linear infinite; filter: drop-shadow(0 8px 12px rgba(255,80,0,0.25)); }
        .flame { position:absolute; width:140px; height:140px; top:-10px; left:-10px; pointer-events:none; opacity:0.85; }

        @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

        @media (max-width:600px){ .pocket { width:150px; height:110px } .blade-wrap{ width:90px;height:90px } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">My Work</h1>

        <div class="placeholder" aria-hidden="true">Works will be added here soon.</div>

        <h2 class="section-title" style="margin-top:20px;">Certificates</h2>
        <div style="text-align:center; color:rgba(255,255,255,0.85); max-width:700px; margin:0 auto 10px;">Certificates are kept in a pocket below — click a thumbnail to open the full certificate.</div>

        <div class="pocket-wrap">
            <div class="pocket" title="Certificates pocket">
                <div class="pocket-title">My Certificates</div>
                <div class="stack">
                    <a class="card" href="cert1.jpg.jpeg" target="_blank" aria-label="Open certificate 1"><img src="cert1.jpg.jpeg" alt="Certificate 1"></a>
                    <a class="card" href="cert2.jpg.jpeg" target="_blank" aria-label="Open certificate 2"><img src="cert2.jpg.jpeg" alt="Certificate 2"></a>
                    <div class="card" aria-hidden="true"></div>
                </div>
                <div class="cert-label">2 certificates</div>
            </div>

            <div class="blade-wrap" aria-hidden="true">
                <svg class="blade" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spinning blade">
                    <defs>
                        <linearGradient id="flameGrad" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0%" stop-color="#fff59d" />
                            <stop offset="40%" stop-color="#ffb74d" />
                            <stop offset="100%" stop-color="#ff3d00" />
                        </linearGradient>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#glow)">
                        <path d="M50 6 L72 38 L60 70 L40 70 L28 38 Z" fill="#222" stroke="#ff6e40" stroke-width="2"/>
                        <path d="M50 18 C58 30, 62 42, 50 54 C40 42, 44 30, 50 18 Z" fill="url(#flameGrad)" opacity="0.95" />
                        <circle cx="50" cy="8" r="2.5" fill="#ffd54f" />
                    </g>
                </svg>
                <svg class="flame" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <radialGradient id="g" cx="50%" cy="40%">
                            <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.8"/>
                            <stop offset="60%" stop-color="#ff5722" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <ellipse cx="100" cy="100" rx="70" ry="40" fill="url(#g)" />
                </svg>
            </div>
        </div>

        <div class="back-home" style="margin-top:30px; text-align:center;">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</body>
</html>
