<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #ffffff;
        }

        .placeholder {
            text-align: center;
            color: rgba(255,255,255,0.75);
            padding: 40px 20px;
            border: 1px dashed rgba(255,255,255,0.06);
            border-radius: 10px;
        }

        /* Pocket Layout */
        .pocket-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            position: relative;
        }

        .pocket {
            width: 220px;
            height: 140px;
            background: rgba(255,255,255,0.03);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }

        .pocket:focus {
            outline: 2px solid rgba(74,108,247,0.25);
        }

        .pocket-title {
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.9);
        }

        /* Card Stack */
        .stack {
            position: relative;
            width: 100%;
            height: 86px;
        }

        .card {
            position: absolute;
            left: 8px;
            top: 6px;
            width: calc(100% - 16px);
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.15);
            background: #fff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transform-origin: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(10%);
        }

        /* Closed stack positions */
        .card.c1 { transform: translate(0px, 0px) rotate(-2deg); z-index: 3; }
        .card.c2 { transform: translate(10px, 8px) rotate(3deg); z-index: 2; }
        .card.c3 { transform: translate(18px, 12px) rotate(6deg); z-index: 1; }

        /* Open spread */
        .pocket.open .card.c1 { transform: translate(-12px, -6px) rotate(-6deg); }
        .pocket.open .card.c2 { transform: translate(28px, -8px) rotate(6deg); }
        .pocket.open .card.c3 { transform: translate(37px, -10px) rotate(12deg); }

        .card:hover {
            transform: translateY(-10px) scale(1.04);
            box-shadow: 0 22px 40px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .cert-label {
            text-align: center;
            margin-top: 6px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
        }

        /* Blade Overlay */
        .blade-overlay {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 88px;
            height: 88px;
            pointer-events: none;
            z-index: 20;
        }

        .blade {
            width: 100%;
            height: 100%;
            animation: spin 2s linear infinite;
            filter: drop-shadow(0 10px 18px rgba(255,80,0,0.28));
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .pocket { width: 170px; height: 120px; }
            .blade-overlay { width: 72px; height: 72px; }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1 class="section-title">My Work</h1>

        <div class="placeholder">Works will be added here soon.</div>

        <h2 class="section-title" style="margin-top:20px;">Certificates</h2>
        <div style="text-align:center; color:rgba(255,255,255,0.85); max-width:700px; margin:0 auto 10px;">
            Click the pocket to open and view your certificates. Click a thumbnail to open the full certificate.
        </div>

        <div class="pocket-wrap">
            <div id="pocket" class="pocket" role="button" tabindex="0" aria-pressed="false">

                <div class="pocket-title">My Certificates</div>

                <div class="stack">
                    <a class="card c1" href="cert1.jpg.jpeg" target="_blank">
                        <img src="cert1.jpg.jpeg" alt="Certificate 1">
                    </a>

                    <a class="card c2" href="cert2.jpg.jpeg" target="_blank">
                        <img src="cert2.jpg.jpeg" alt="Certificate 2">
                    </a>

                    <a class="card c3" href="Screenshot_12_6-2025_1029_.jpeg" target="_blank">
                        <img src="Screenshot_12-6-2025_1029_.jpeg" alt="Certificate 3">
                    </a>
                </div>

                <div class="cert-label">3 certificates</div>

                <div class="blade-overlay">
                    <svg class="blade" viewBox="0 0 100 100">
                        <path d="M50 6 L72 38 L60 70 L40 70 L28 38 Z" fill="#222" stroke="#ff6e40" stroke-width="2"/>
                        <path d="M50 18 C58 30, 62 42, 50 54 C40 42, 44 30, 50 18 Z"
                              fill="url(#flameGrad)" opacity="0.95"/>
                    </svg>
                </div>

            </div>
        </div>

        <div class="back-home" style="margin-top:30px; text-align:center;">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>

    </div>

<script>
    const pocket = document.getElementById('pocket');

    function togglePocket() {
        const isOpen = pocket.classList.toggle('open');
        pocket.setAttribute('aria-pressed', isOpen);
    }

    pocket.addEventListener('click', togglePocket);

    pocket.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePocket();
        }
    });

    document.querySelectorAll('.card').forEach(c => c.tabIndex = -1);

    pocket.addEventListener('transitionend', () => {
        const open = pocket.classList.contains('open');
        document.querySelectorAll('.card').forEach(c => c.tabIndex = open ? 0 : -1);
    });
</script>

</body>
</html>
