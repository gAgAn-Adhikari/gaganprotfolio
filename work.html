<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #000428 0%, #004e92 100%); color: #fff; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .section-title { text-align: center; margin-bottom: 20px; font-size: 2rem; color: #ffffff; }
        .placeholder { text-align:center; color:rgba(255,255,255,0.85); padding:40px 20px; border: 1px dashed rgba(255,255,255,0.06); border-radius:10px; }
        .certificates { display:flex; justify-content:center; gap:16px; margin-top:20px; }
        .certificate-small { width:150px; background: rgba(255,255,255,0.03); padding:8px; border-radius:8px; text-align:center; border:1px solid rgba(255,255,255,0.05); }
        .certificate-small img { width:100%; height:auto; display:block; border-radius:6px; }
        .certificate-small h4 { font-size:0.95rem; margin:8px 0 0; color:#fff; }
        .back-home { margin-top:30px; text-align:center; }
        .back-home a { color: #fff; background: rgba(74,108,247,0.15); padding: 8px 14px; border-radius: 999px; display: inline-block; }
        @media (max-width:500px){ .certificate-small{ width:110px } .section-title{ font-size:1.4rem } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">My Work</h1>

        <div class="placeholder" aria-hidden="true">
            Works will be added here soon.
        </div>

        <h2 class="section-title" style="margin-top:28px;">Certificates</h2>
        <div style="text-align:center; color:rgba(255,255,255,0.85); max-width:700px; margin:0 auto 10px;">Below are a few certificates I have received. Click to open or download.</div>

        <div class="certificates">
            <div class="certificate-small">
                <a href="Screenshot_12-6-2025_1029_.jpeg" target="_blank">
                    <img src="Screenshot_12-6-2025_1029_.jpeg" alt="Certificate">
                </a>
                <h4>Certificate</h4>
            </div>
        </div>

        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</body>
</html>
