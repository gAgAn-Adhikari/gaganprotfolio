<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #000428 0%, #004e92 100%); color: #fff; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .section-title { text-align: center; margin-bottom: 20px; font-size: 2rem; color: #ffffff; }
        .placeholder { text-align:center; color:rgba(255,255,255,0.75); padding:40px 20px; border: 1px dashed rgba(255,255,255,0.06); border-radius:10px; }

        /* Pocket */
        .pocket-wrap { display:flex; justify-content:center; align-items:center; gap:20px; margin-top:20px; position:relative; }
        .pocket { width:220px; height:140px; background: rgba(255,255,255,0.03); border-radius:18px; border:1px solid rgba(255,255,255,0.06); padding:12px; box-shadow:0 8px 24px rgba(0,0,0,0.4); overflow:visible; transition: transform 0.25s ease, box-shadow 0.25s ease; position:relative; cursor:pointer; }
        .pocket:focus { outline:2px solid rgba(74,108,247,0.25); }
        .pocket-title { text-align:center; font-size:0.95rem; margin-bottom:8px; color:rgba(255,255,255,0.9); }

        .stack { position:relative; width:100%; height:86px; display:block; }
        .card { position:absolute; left:8px; top:6px; width:calc(100% - 16px); height:70px; border-radius:8px; overflow:hidden; border:1px solid rgba(0,0,0,0.15); box-shadow:0 6px 18px rgba(0,0,0,0.25); background:#fff; transform-origin:center; transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease; }
        .card img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(10%); }
        .card.hidden { opacity:0; pointer-events:none; }

        /* closed (stacked) */
        .card.c1{ transform: translate(0px, 0px) rotate(-2deg); z-index:3; }
        .card.c2{ transform: translate(10px, 8px) rotate(3deg); z-index:2; }

        /* open (spread) */
        .pocket.open .card.c1{ transform: translate(-12px, -6px) rotate(-6deg); z-index:3; }
        .pocket.open .card.c2{ transform: translate(28px, -8px) rotate(6deg); z-index:2; }

        .card:hover { transform: translateY(-10px) scale(1.04); box-shadow:0 22px 40px rgba(0,0,0,0.5); z-index:10; }

        .cert-label{ text-align:center; margin-top:6px; font-size:0.85rem; color:rgba(255,255,255,0.9); }

        /* Spinning fire blade (overlayed on pocket) */
        .blade-overlay { position:absolute; top:6px; left:50%; transform:translateX(-50%); width:88px; height:88px; pointer-events:none; z-index:20; }
        .blade { width:100%; height:100%; display:block; transform-origin:center; animation: spin 2s linear infinite; filter: drop-shadow(0 10px 18px rgba(255,80,0,0.28)); }
        .blade-flame { position:absolute; width:140px; height:140px; top:-28px; left:50%; transform:translateX(-50%); pointer-events:none; opacity:0.9; z-index:15; }

        @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

        @media (max-width:600px){ .pocket { width:170px; height:120px } .blade-overlay{ width:72px;height:72px } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">My Work</h1>

        <div class="placeholder" aria-hidden="true">Works will be added here soon.</div>

        <h2 class="section-title" style="margin-top:20px;">Certificates</h2>
        <div style="text-align:center; color:rgba(255,255,255,0.85); max-width:700px; margin:0 auto 10px;">Click the pocket to open and view your certificates. Click a thumbnail to open the full certificate.</div>

        <div class="pocket-wrap">
            <div id="pocket" class="pocket" role="button" tabindex="0" aria-pressed="false" aria-label="Open certificates pocket">
                <div class="pocket-title">My Certificates</div>
                <div class="stack" id="stack">
                    <a class="card c1" href="cert1.jpg.jpeg" target="_blank" aria-label="Open certificate 1"><img src="cert1.jpg.jpeg" alt="Certificate 1"></a>
                    <a class="card c2" href="cert2.jpg.jpeg" target="_blank" aria-label="Open certificate 2"><img src="cert2.jpg.jpeg" alt="Certificate 2"></a>
                    <a class ="card c2" href="Screenshot_12_6-2025_1029_.jpeg" target="_blank" aria-label="Open certificate 3"><img src="Screenshot_12_6-2025_1029_.jpeg" alt="Certificate 3"</a>
                </div>
                <div class="cert-label">2 certificates</div>

                <!-- blade overlay positioned over pocket -->
                <div class="blade-overlay" aria-hidden="true">
                    <svg class="blade" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spinning blade">
                        <defs>
                            <linearGradient id="flameGrad" x1="0" x2="1" y1="0" y2="1">
                                <stop offset="0%" stop-color="#fff59d" />
                                <stop offset="40%" stop-color="#ffb74d" />
                                <stop offset="100%" stop-color="#ff3d00" />
                            </linearGradient>
                            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </feMerge>
                        </defs>
                        <g filter="url(#glow)">
                            <path d="M50 6 L72 38 L60 70 L40 70 L28 38 Z" fill="#222" stroke="#ff6e40" stroke-width="2"/>
                            <path d="M50 18 C58 30, 62 42, 50 54 C40 42, 44 30, 50 18 Z" fill="url(#flameGrad)" opacity="0.95" />
                            <circle cx="50" cy="8" r="2.5" fill="#ffd54f" />
                        </g>
                    </svg>
                </div>

                <svg class="blade-flame" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <radialGradient id="g" cx="50%" cy="40%">
                            <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.8"/>
                            <stop offset="60%" stop-color="#ff5722" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <ellipse cx="100" cy="100" rx="70" ry="40" fill="url(#g)" />
                </svg>

            </div>
        </div>

        <div class="back-home" style="margin-top:30px; text-align:center;">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

<script>
// Toggle pocket open/close to show/hide certificates
const pocket = document.getElementById('pocket');
function togglePocket() {
  const isOpen = pocket.classList.toggle('open');
  pocket.setAttribute('aria-pressed', isOpen ? 'true' : 'false');
}
// Click or Enter/Space to toggle
pocket.addEventListener('click', togglePocket);
pocket.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePocket(); } });
// Ensure certificates are focusable when open
pocket.addEventListener('transitionend', () => {
  const cards = pocket.querySelectorAll('.card');
  const open = pocket.classList.contains('open');
  cards.forEach(c => { c.tabIndex = open ? 0 : -1; });
});
// Initialize cards as not focusable until opened
document.querySelectorAll('.card').forEach(c => c.tabIndex = -1);
</script>
</body>
</html>
